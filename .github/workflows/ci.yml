
name: CI Java Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Afficher les versions
        run: |
          java -version
          mvn -version

      - name: Compiler le projet
        run: mvn clean compile

      - name: Exécuter les tests
        run: mvn test

      - name: Afficher le rapport des tests
        if: always()
        run: |
          cat target/surefire-reports/*.txt || echo "Aucun rapport disponible"

      - name: Signaler l'échec
        if: failure()
        run: echo "La compilation ou les tests ont échoué."
